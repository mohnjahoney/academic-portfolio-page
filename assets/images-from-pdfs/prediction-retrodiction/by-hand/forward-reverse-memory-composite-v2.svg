<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 1224 1168" role="img" aria-labelledby="title desc">
  <title id="title">Forward and reverse models with asymmetric memory</title>
  <desc id="desc">Two models sit above overlapping memory regions. Blue and green labels identify forward and reverse information across both parts of the figure.</desc>

  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="5.6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#17221d"/>
    </marker>
    <clipPath id="forward-memory-clip">
      <ellipse cx="380" cy="870" rx="275" ry="225"/>
    </clipPath>
  </defs>

  <rect x="-24" y="-24" width="1224" height="1168" fill="#fbfaf7"/>

  <!-- Direction labels and model descriptions -->
  <g transform="translate(325 0)" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="0" y="125" fill="#5d625e" font-size="24">predicting toward the future</text>
    <text x="520" y="125" fill="#5d625e" font-size="24">reconstructing toward the past</text>
  </g>

  <!-- Section labels -->
  <g fill="#17221d" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" letter-spacing="1.2" text-anchor="middle">
    <text transform="translate(34 325) rotate(-90)">MODELS</text>
    <text transform="translate(34 845) rotate(-90)">MEMORY</text>
  </g>

  <!-- Forward model -->
  <g id="forward-model" transform="translate(40 60)" fill="none" stroke="#17221d" stroke-linecap="round" stroke-width="4">
    <path d="M253 205C219 243 192 279 179 320" marker-end="url(#arrow-ink)"/>
    <path d="M317 205C351 243 378 279 391 320" marker-end="url(#arrow-ink)"/>
    <path d="M373 346C329 322 296 275 290 228" marker-end="url(#arrow-ink)"/>
    <path d="M203 380C250 416 313 416 348 380" marker-end="url(#arrow-ink)"/>
    <g fill="#c7dff2" stroke="#2475b8" stroke-width="8">
      <circle cx="285" cy="176" r="58"/>
      <circle cx="165" cy="374" r="58"/>
      <circle cx="405" cy="374" r="58"/>
    </g>
  </g>

  <!-- Reverse model -->
  <g id="reverse-model" transform="translate(-70 60)" fill="none" stroke="#17221d" stroke-linecap="round" stroke-width="4">
    <path d="M818 158C862 132 929 132 970 151" marker-end="url(#arrow-ink)"/>
    <path d="M991 191C944 216 881 216 840 195" marker-end="url(#arrow-ink)"/>
    <path d="M790 218V316" marker-end="url(#arrow-ink)"/>
    <path d="M1040 218V316" marker-end="url(#arrow-ink)"/>
    <path d="M831 375H975" marker-end="url(#arrow-ink)"/>
    <path d="M1009 345C961 297 900 248 846 215" marker-end="url(#arrow-ink)"/>
    <g fill="#cfe5d9" stroke="#3d7d63" stroke-width="8">
      <circle cx="790" cy="176" r="58"/>
      <circle cx="1040" cy="176" r="58"/>
      <circle cx="790" cy="374" r="58"/>
      <circle cx="1040" cy="374" r="58"/>
    </g>
  </g>

  <!-- Memory regions -->
  <ellipse cx="750" cy="840" rx="390" ry="260" fill="#cfe5d9"/>
  <ellipse cx="380" cy="870" rx="275" ry="225" fill="#c7dff2"/>
  <ellipse cx="750" cy="840" rx="390" ry="260" clip-path="url(#forward-memory-clip)" fill="#f2e4a3"/>
  <ellipse cx="750" cy="840" rx="390" ry="260" fill="none" stroke="#3d7d63" stroke-width="7"/>
  <ellipse cx="380" cy="870" rx="275" ry="225" fill="none" stroke="#2475b8" stroke-width="7"/>

  <!-- One label for each direction, shared by the model and memory rows -->
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <g transform="translate(325 48)">
      <rect x="-132" y="-28" width="264" height="64" rx="18" fill="#c7dff2" stroke="#2475b8" stroke-width="6"/>
      <text y="14" fill="#17221d" font-size="32" font-weight="700" letter-spacing="1.2">FORWARD</text>
    </g>
    <g transform="translate(520 810)">
      <rect x="-100" y="50" width="200" height="104" rx="14" fill="#fbfaf7" stroke="#d1b95f" stroke-width="4"/>
      <text y="96" fill="#17221d" font-size="34" font-weight="700" letter-spacing="1.2">SHARED</text>
      <text y="138" fill="#17221d" font-size="32">information</text>
    </g>
    <g transform="translate(845 48)">
      <rect x="-138" y="-28" width="276" height="64" rx="18" fill="#cfe5d9" stroke="#3d7d63" stroke-width="6"/>
      <text y="14" fill="#17221d" font-size="32" font-weight="700" letter-spacing="1.2">REVERSE</text>
    </g>
  </g>

  <!-- Information notation -->
  <g fill="#17221d" font-family="Georgia, serif" font-size="64" font-weight="700" text-anchor="middle">
    <text x="285" y="830">C<tspan baseline-shift="sub" font-size="42">μ</tspan><tspan baseline-shift="super" font-size="42">+</tspan></text>
    <text x="520" y="830">E</text>
    <text x="875" y="830">C<tspan baseline-shift="sub" font-size="42">μ</tspan><tspan baseline-shift="super" font-size="42">−</tspan></text>
  </g>
</svg>
