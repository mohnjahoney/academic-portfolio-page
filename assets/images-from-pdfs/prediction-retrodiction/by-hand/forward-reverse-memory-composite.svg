<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1170" role="img" aria-labelledby="title desc">
  <title id="title">Forward and reverse models with asymmetric memory</title>
  <desc id="desc">A three-state forward model and a four-state reverse model connect to overlapping memory regions. The reverse-memory region is substantially larger than the forward-memory region, while their overlap represents shared information.</desc>

  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="5.6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#17221d"/>
    </marker>
    <clipPath id="forward-memory-clip">
      <ellipse cx="450" cy="900" rx="240" ry="195"/>
    </clipPath>
  </defs>

  <rect width="1200" height="1170" fill="#fbfaf7"/>

  <!-- Plain-language model labels -->
  <g fill="#17221d" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="280" y="40" font-size="28" font-weight="700" letter-spacing="2.5">FORWARD MODEL</text>
    <text x="280" y="82" fill="#2475b8" font-size="23">predicting toward the future</text>
    <text x="900" y="40" font-size="28" font-weight="700" letter-spacing="2.5">REVERSE MODEL</text>
    <text x="900" y="82" fill="#3d7d63" font-size="23">reconstructing toward the past</text>
  </g>

  <!-- Forward model: nodes and directed transitions -->
  <g id="forward-model" fill="none" stroke="#17221d" stroke-linecap="round" stroke-width="4">
    <path d="M254 191C223 228 197 264 185 300" marker-end="url(#arrow-ink)"/>
    <path d="M306 191C337 228 363 264 375 300" marker-end="url(#arrow-ink)"/>
    <path d="M359 327C316 302 286 259 281 222" marker-end="url(#arrow-ink)"/>
    <path d="M207 361C253 398 305 398 335 361" marker-end="url(#arrow-ink)"/>
    <g fill="#c7dff2" stroke="#2475b8" stroke-width="7">
      <circle cx="280" cy="164" r="54"/>
      <circle cx="165" cy="354" r="54"/>
      <circle cx="395" cy="354" r="54"/>
    </g>
  </g>

  <!-- Reverse model: nodes and directed transitions -->
  <g id="reverse-model" fill="none" stroke="#17221d" stroke-linecap="round" stroke-width="4">
    <path d="M816 147C860 122 921 122 957 140" marker-end="url(#arrow-ink)"/>
    <path d="M978 179C932 203 881 203 845 184" marker-end="url(#arrow-ink)"/>
    <path d="M790 206V295" marker-end="url(#arrow-ink)"/>
    <path d="M1010 206V295" marker-end="url(#arrow-ink)"/>
    <path d="M832 354H951" marker-end="url(#arrow-ink)"/>
    <path d="M978 326C930 279 880 238 835 203" marker-end="url(#arrow-ink)"/>
    <g fill="#cfe5d9" stroke="#3d7d63" stroke-width="7">
      <circle cx="790" cy="164" r="54"/>
      <circle cx="1010" cy="164" r="54"/>
      <circle cx="790" cy="354" r="54"/>
      <circle cx="1010" cy="354" r="54"/>
    </g>
  </g>

  <!-- Optional transition labels. Change display="none" to display="inline". -->
  <g id="edge-labels" display="none" fill="#5d625e" font-family="Georgia, serif" font-size="17" text-anchor="middle">
    <g id="forward-edge-labels">
      <text x="194" y="252">½|0</text>
      <text x="366" y="252">½|1</text>
      <text x="299" y="269">1|1</text>
      <text x="280" y="414">½|0 · ½|1</text>
    </g>
    <g id="reverse-edge-labels">
      <text x="900" y="126">¾|1</text>
      <text x="900" y="215">⅔|1</text>
      <text x="758" y="264">¼|0</text>
      <text x="1042" y="264">⅓|0</text>
      <text x="900" y="381">1|0</text>
      <text x="918" y="257">1|1</text>
    </g>
  </g>

  <!-- Plain-language memory labels -->
  <g fill="#17221d" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <g transform="translate(300 540)">
      <text font-size="34" font-weight="700" letter-spacing="1.5">FORWARD</text>
      <text y="42" font-size="34">memory</text>
    </g>
    <g transform="translate(535 540)">
      <text font-size="34" font-weight="700" letter-spacing="1.5">SHARED</text>
      <text y="42" font-size="34">information</text>
    </g>
    <g transform="translate(875 540)">
      <text font-size="34" font-weight="700" letter-spacing="1.5">REVERSE</text>
      <text y="42" font-size="34">memory</text>
    </g>
  </g>

  <!-- Asymmetric information regions -->
  <ellipse cx="730" cy="900" rx="350" ry="260" fill="#cfe5d9"/>
  <ellipse cx="450" cy="900" rx="240" ry="195" fill="#c7dff2"/>
  <ellipse cx="730" cy="900" rx="350" ry="260" clip-path="url(#forward-memory-clip)" fill="#f2e4a3"/>

  <ellipse cx="730" cy="900" rx="350" ry="260" fill="none" stroke="#3d7d63" stroke-width="6"/>
  <ellipse cx="450" cy="900" rx="240" ry="195" fill="none" stroke="#2475b8" stroke-width="6"/>

  <!-- Information notation -->
  <g id="notation-labels" fill="#17221d" font-family="Georgia, serif" font-size="60" font-weight="700" text-anchor="middle">
    <text x="300" y="922">C<tspan baseline-shift="sub" font-size="39">μ</tspan><tspan baseline-shift="super" font-size="39">+</tspan></text>
    <text x="535" y="922">E</text>
    <text x="875" y="922">C<tspan baseline-shift="sub" font-size="39">μ</tspan><tspan baseline-shift="super" font-size="39">−</tspan></text>
  </g>
</svg>
