<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Asymmetric forward and reverse memory</title>
  <desc id="desc">Overlapping information regions show forward memory, shared information, and a substantially larger reverse-memory requirement.</desc>
  <defs>
    <clipPath id="forward-memory-clip">
      <ellipse cx="360" cy="240" rx="240" ry="160"/>
    </clipPath>
    <marker id="time-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#17221d"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="600" fill="#ffffff"/>
  <!-- <rect x="0" y="0" width="1000" height="580" fill="#fbfaf7"/> -->
  <!-- A shared time series: the process can be read in either direction. -->
  <path d="M60 530 H1140" fill="none" stroke="#17221d" stroke-width="6" stroke-linecap="round" marker-start="url(#time-arrow)" marker-end="url(#time-arrow)" opacity="0.62"/>
  <g fill="#ffffff" stroke="#17221d" stroke-width="3">
    <circle cx="170" cy="530" r="40"/>
    <circle cx="277.5" cy="530" r="40"/>
    <circle cx="385" cy="530" r="40"/>
    <circle cx="492.5" cy="530" r="40"/>
    <circle cx="600" cy="530" r="40"/>
    <circle cx="707.5" cy="530" r="40"/>
    <circle cx="815" cy="530" r="40"/>
    <circle cx="922.5" cy="530" r="40"/>
    <circle cx="1030" cy="530" r="40"/>
  </g>
  <g fill="#17221d" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="700" text-anchor="middle" transform="translate (0,6)">
    <text x="170" y="540">0</text>
    <text x="277.5" y="540">1</text>
    <text x="385" y="540">1</text>
    <text x="492.5" y="540">0</text>
    <text x="600" y="540">1</text>
    <text x="707.5" y="540">0</text>
    <text x="815" y="540">0</text>
    <text x="922.5" y="540">1</text>
    <text x="1030" y="540">1</text>
  </g>
  <!-- Plain-language labels -->
  <!-- <g fill="#17221d" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <g transform="translate(160 -10)"></g>
    <g transform="translate(395 -10)"></g>
    <g transform="translate(735 -10)"></g>
  </g> -->
  <!-- Asymmetric information regions -->
  <ellipse cx="700" cy="240" rx="350" ry="220" fill="#cfe5d9"/>
  <ellipse cx="360" cy="240" rx="240" ry="160" fill="#c7dff2"/>
  <ellipse cx="700" cy="240" rx="350" ry="220" clip-path="url(#forward-memory-clip)" fill="#f2e4a3"/>
  <ellipse cx="700" cy="240" rx="350" ry="220" fill="none" stroke="#3d7d63" stroke-width="8"/>
  <ellipse cx="360" cy="240" rx="240" ry="160" fill="none" stroke="#2475b8" stroke-width="8"/>
  <!-- Information notation -->
  <g fill="#17221d" font-family="Georgia, serif" font-size="90" font-weight="700" text-anchor="middle">
    <text x="260" y="262">C<tspan baseline-shift="sub" font-size="50">μ</tspan><tspan baseline-shift="super" font-size="50">+</tspan></text>
    <text x="460" y="262">E</text>
    <text x="750" y="262">C<tspan baseline-shift="sub" font-size="50">μ</tspan><tspan baseline-shift="super" font-size="50">−</tspan></text>
  </g>
</svg>
